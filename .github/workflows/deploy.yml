name: Deploy

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  # the closed event of a merged PR reports the base branch as github.ref,
  # so key PR runs on their number to keep them from replacing the master deploy
  group: deploy-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-hugo
        if: github.event.action != 'closed'

      - name: Build
        if: github.event.action != 'closed'
        run: hugo build --minify --panicOnWarning --baseURL "$BASE_URL"
        env:
          BASE_URL: ${{ github.event_name == 'pull_request' && format('https://juliagpu.org/pr-preview/pr-{0}/', github.event.number) || 'https://juliagpu.org/' }}
          # keeps previews out of search engines, see head.html
          HUGO_PARAMS_PREVIEW: ${{ github.event_name == 'pull_request' }}

      # pull requests from forks get no preview, as their token cannot write
      - name: Deploy preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: public
          pages-base-url: juliagpu.org
          qr-code: false
          deploy-commit-message: Deploy preview for PR ${{ github.event.number }}
          remove-commit-message: Remove preview for PR ${{ github.event.number }}

      - name: Deploy
        if: github.event_name == 'push'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public
          clean-exclude: pr-preview/
          # previews are pushed to the same branch concurrently, don't overwrite them
          force: false
