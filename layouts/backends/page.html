{{ define "main" }}
<article class="container prose">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    <p class="lead">{{ .Description }}</p>
    <p class="actions">
      {{- range .Params.packages }}
      <a class="button" href="{{ .documentation }}">{{ .name }} documentation</a>
      {{- end }}
      {{- range .Params.packages }}
      <a class="button secondary" href="{{ .repository }}" aria-label="{{ .name }} on GitHub">{{ partial "icon.html" "github" }} {{ .name }}</a>
      {{- end }}
    </p>
  </header>
  {{ .Content }}
</article>
{{ end }}
