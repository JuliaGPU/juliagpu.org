{{ define "main" }}
<article class="container prose">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    <p class="lead">{{ .Description }}</p>
    <p class="actions">
      <a class="button" href="{{ .Params.documentation }}">{{ .Params.package }} documentation</a>
      <a class="button secondary" href="{{ .Params.repository }}">{{ partial "icon.html" "github" }} GitHub</a>
    </p>
  </header>
  {{ .Content }}
</article>
{{ end }}
